name: SolarNav CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend scripts
      - run: pytest backend/tests -q
      - run: python scripts/architecture_check.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check frontend/js/api.js
      - run: node --check frontend/js/app.js
      - run: node --check frontend/js/dashboard.js
      - run: node --check frontend/digital_twin/scene.js
      - working-directory: frontend
        run: npm test
